<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="hero">
    <p class="brand">{{ app_name }}</p>
    <h1>Воронка, бот с ИИ и CRM в одном контуре</h1>
    <p class="lead">
      Лид с лендинга уходит в Telegram, бот квалифицирует задачу и кладёт заявку в mini-CRM.
    </p>
    <div class="actions">
      <a class="btn primary" id="cta-bot" href="{{ bot_link }}">Написать в бота</a>
      <a class="btn ghost" href="/crm">Открыть CRM</a>
    </div>
  </main>
  <script>
    (async () => {
      try {
        await fetch('/api/funnel/hit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: 'landing', path: location.pathname })
        });
      } catch (e) {}
      const params = new URLSearchParams(location.search);
      const src = params.get('src') || 'landing';
      const link = document.getElementById('cta-bot');
      if (link && !link.href.includes('start=')) {
        // deep-link подставишь после создания бота: https://t.me/<bot>?start=landing
        link.dataset.source = src;
      }
    })();
  </script>
</body>
</html>
