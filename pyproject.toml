[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-funnel-ecosystem"
version = "0.1.0"
description = "Воронка лидов, Telegram AI-бот и mini-CRM в одном стеке"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Богдан Щербинин" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "greenlet>=3.0.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "aiogram>=3.13.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
aifunnel-api = "aifunnel.api.app:run"
aifunnel-bot = "aifunnel.bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
